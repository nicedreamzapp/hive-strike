const C=document.getElementById('c');let X=C.getContext('2d');const W=480,H=720;
// RS is the raster scale: how many device pixels the 480x720 play field actually gets.
// It is NOT devicePixelRatio. On a 12.9" iPad the field is letterboxed up to 1821x2732
// device px, so a DPR-sized 960x1440 backing store was being stretched 1.9x and every
// sprite, every bug, the whole game looked soft. On a phone the opposite happened and it
// rendered ~10% MORE pixels than the screen could show. fit() sets this from the real box.
// LOW is cheap-phone mode. A 480x720 field rendered at full device pixels, plus a live
// canvas blur under every sprite, costs an iPhone nothing and murders a budget Android:
// Skia does not GPU-accelerate ctx.filter blur, so each blurred draw is a fresh offscreen
// layer. LOW caps the raster and drops the blurs. It turns itself on after a slow couple
// of seconds of real play and remembers the answer for next launch.
// LOW2 is the floor under LOW, for 2018-class budget chips (measured 2026-09-02 on a MediaTek
// MT6765 burner: 5 fps in LOW with 11 bugs on screen). It renders at 1.0 raster and draws every
// embossed sprite in one direct pass -- no offscreen rim/gloss/shadow passes, which were the
// whole cost (5 -> 12.5 fps on the frozen frame). hs_low: '0' full, '1' LOW, '2' LOW2.
// LOW3 is bare bones under LOW2 (Matt, 2026-09-02, still glitchy on the burner): 0.85 raster,
// no glows (rg returns a flat body colour and drops transparent-edged glows), no enemy-shot
// trails, no bee aura, at most 40 particles drawn.
let LOW=false,LOW2=false,LOW3=false; try{const v=localStorage.hs_low;LOW=v==='1'||v==='2'||v==='3';LOW2=v==='2'||v==='3';LOW3=v==='3';}catch(e){}
const RASTER_MAX=()=>LOW3?0.85:LOW2?1:LOW?1.25:4;
function lowSave(){try{localStorage.hs_low=LOW3?'3':LOW2?'2':LOW?'1':'0';}catch(e){}}
function setLow(v){if(LOW===v&&!(LOW2&&!v))return;LOW=v;if(!v){LOW2=false;LOW3=false;}lowSave();fit();}
function setLow2(v){if(LOW2===v&&!(LOW3&&!v))return;LOW2=v;if(v)LOW=true;else LOW3=false;lowSave();fit();}
function setLow3(v){if(LOW3===v)return;LOW3=v;if(v){LOW=true;LOW2=true;}lowSave();fit();}
let DPR=Math.min(3,window.devicePixelRatio||1);
C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0);
const FONT='"Avenir Next Condensed","Futura","Arial Narrow","Helvetica Neue",sans-serif';
// stamped by tools/assemble.py from the version in package.json and the git commit --
// never edit by hand. It is how you tell at a glance whether the phone in your hand is
// running the same build as the one next to it.
const BUILD='v1.0.0  ·  a0acbbe+  ·  Sep 3';
// letterbox the play field inside whatever the device actually gives us, safe-area padding
// already removed by the body. visualViewport is the honest number on iOS.
function fit(){const cs=getComputedStyle(document.body),

 aw=Math.max(1,(vv?vv.width:innerWidth)-px), ah=Math.max(1,(vv?vv.height:innerHeight)-py),

 // render exactly the pixels this screen will show -- no upscale on a tablet, no waste
 // on a phone. Capped at 4 so a huge display cannot blow the memory budget.
 const want=Math.max(LOW3?0.85:1,Math.min(RASTER_MAX(),+(sc*(window.devicePixelRatio||1)).toFixed(3)));
 if(Math.abs(want-DPR)>0.01||C.width!==Math.round(W*want)){

// the bugs. That was right when the beds were filler and wrong now that every bed is one
// of Matt's own tracks. Two independent levels, both set-able, so nobody has to guess.

function setMusLv(v){MUSLV=Math.max(0,Math.min(1,+v.toFixed(2)));localStorage.hs_muslv=MUSLV;}

// ---------- music: Song Forge instrumental beds (music/main.mp3 for levels, music/boss.mp3 for boss fights) ----------
// iOS does not let you set the volume of an <audio> element. It accepts the
// assignment, then resets to 1 the moment the media loads -- measured on device:
// "set 0.045 -> reads back 0.045 ... after load: 1". So every bed played at FULL
// volume instead of 4.5%, the fade-out that stops the previous track never reached
// zero, and old tracks never paused: level music, boss music and the title theme
// all stacked on top of each other. Route every track through a GainNode instead.
// That is honoured on every platform.
const MUSIC={tracks:{},gains:{},cur:null,want:null,duck:1,on:localStorage.hs_music!=null?localStorage.hs_music==='1':true};
function musicGain(k,a){
 let g=MUSIC.gains[k];
 if(g!==undefined)return g;
 // Opened straight from disk (the Desktop launcher, a double-clicked index.html) the page
 // is file:// and Chromium treats every file as its own origin, so a media element pushed
 // through Web Audio is "cross-origin" and comes out as pure silence -- the track plays,
 // currentTime climbs, and nothing reaches the speakers (measured 2026-09-01: peak 0.0000).
 // Desktop browsers honour a.volume, so on file:// skip the graph and use it directly.
 if(location.protocol==='file:'){MUSIC.gains[k]=null;return null;}
 // Android WebView (Capacitor serves the bundle from https://localhost through an intercepted
 // request) does the same thing: the element plays, currentTime climbs, and the graph output is
 // exactly 0 -- measured on the burner phone 2026-09-02 with an AnalyserNode on the gain node
 // (music peak 0.00000 while a control oscillator read fine). Android honours a.volume, so
 // skip the graph there too. Only iOS needs the GainNode route.
 if(/Android/i.test(navigator.userAgent)){MUSIC.gains[k]=null;return null;}
 try{const ac=ctx();const src=ac.createMediaElementSource(a);g=ac.createGain();g.gain.value=0;src.connect(g).connect(ac.destination);}
 catch(e){g=null;}                       // fall back to a.volume if the graph refuses
 MUSIC.gains[k]=g;return g;}
const mvol=(k,a)=>{const g=MUSIC.gains[k];return g?g.gain.value:a.volume;};
function msetvol(k,a,v){const g=musicGain(k,a);if(g)g.gain.value=v;else a.volume=v;}
// Diagnostic readout (2026-09-02, Android burner reported no music): the music button's
// toast now shows the audio context state and the wanted track's element state so the
// cause can be read straight off the phone -- no adb needed.
function musicDiag(){const k=MUSIC.want,a=k&&MUSIC.tracks[k],acs=(typeof AC!=='undefined'&&AC)?AC.state:'noctx';
 if(!a)return 'ac:'+acs+' want:'+k;
 return 'ac:'+acs+' '+k+' rs'+a.readyState+' ns'+a.networkState+(a.error?' err'+a.error.code:'')+(a.bad?' BAD':'')+(a.paused?' paused':' playing')+' t'+a.currentTime.toFixed(1)+' g'+mvol(k,a).toFixed(3)+' lv'+MUSLV+' '+((typeof LOW!=='undefined'&&LOW)?'LOW':'full');}
function musicToggle(){MUSIC.on=!MUSIC.on;localStorage.hs_music=MUSIC.on?'1':'0';say(MUSIC.on?'MUSIC ON':'MUSIC OFF');}
window.musicDiag=musicDiag;
function musicLoad(){const names=['main','boss','win','title'];for(let n=1;n<=16;n++){names.push('level'+n,'boss'+n);}for(const k of names){const a=new Audio('music/'+k+'.mp3');a.loop=k!=='win';a.volume=0;a.preload='none';a.ok=false;a.addEventListener('canplay',()=>{a.ok=true;});a.addEventListener('error',()=>{a.ok=false;a.bad=true;});MUSIC.tracks[k]=a;}}
function musicPick(kind){if(kind==='win')return 'win';if(kind==='title')return 'title';const n=(stage-1)%NL+1,k=(kind==='boss'?'boss':'level')+n,a=MUSIC.tracks[k];if(a&&!a.bad){if(a.preload==='none'){a.preload='auto';a.load();}return k;}return kind==='boss'?'boss':'main';}
// A scene change should not be a hard cut between two of Matt's songs. Whenever the
// wanted track changes -- level to boss, boss to the next world, anything to the title --
// duck the music down fast and let it climb back slowly underneath the new scene.
const DUCK_FRAMES=72;
function musicDuck(f=DUCK_FRAMES){MUSIC.duckT=Math.max(MUSIC.duckT||0,f);}
function music(name){const w=name?musicPick(name):null;if(w!==MUSIC.want)musicDuck();MUSIC.want=w;}
function musicTick(){
 if(MUSIC.duckT>0)MUSIC.duckT--;
 const dtgt=MUSIC.duckT>0?.12:1;
 MUSIC.duck+=(dtgt-MUSIC.duck)*(MUSIC.duckT>0?.18:.028);   // dip fast, come back gently
 for(const k in MUSIC.tracks){const a=MUSIC.tracks[k],boss=k.startsWith('boss'),
  target=(k===MUSIC.want&&(state==='play'||k==='title')&&!paused&&MUSIC.on&&!(k==='win'&&a.ended))?VOL*MUSLV*MUSIC.duck*(boss?1.08:k==='win'?1.2:1)*(typeof frenzy!=='undefined'&&frenzy>0?1.3:1):0;
  if(target>0&&a.paused){if(a.bad){MUSIC.want=k.startsWith('boss')?'boss':'main';return;}musicGain(k,a);a.play().catch(()=>{});}
  if(target<=0&&a.paused)continue;                       // nothing to fade on a stopped track
  const v=mvol(k,a)+(target-mvol(k,a))*.04;
  msetvol(k,a,v);
  if(v<.004&&target===0&&!a.paused){a.pause();msetvol(k,a,0);}}}

treams. Finding them means the water is healthy.'},whitefly:{name:'WHITEFLIES',fact:'Whiteflies are not flies. They are tiny cousins of aphids, dusted with white wax.'},springtail:{name:'SPRINGTAILS',fact:'A springtail has a spring folded under its belly. Let go, and the bug pops into the air many times its own length.'},leafhopper:{name:'LEAFHOPPERS',fact:'Leafhoppers talk by shaking the plant they stand on. The buzz travels down the stem like a phone line.'},fungusgnat:{name:'FUNGUS GNATS',fact:'Fungus gnat babies eat mushrooms and roots. Some kinds march together in a long line like a tiny snake.'},mayfly:{name:'MAYFLIES',fact:'A mayfly spends years underwater as a baby, then lives about a day as an adult. It cannot even eat.'},noseeum:{name:'NO-SEE-UMS',fact:'No-see-ums are so small they fit through a window screen, which is how they got their name.'},psyllid:{name:'PSYLLIDS',fact:'Psyllids look like tiny cicadas and jump like fleas. Most kinds eat only one type of plant.'},lacebug:{name:'LACE BUGS',fact:'A lace bug\'s wings look like lace. Each one is a tiny stained-glass window.'},planthopper:{name:'PLANTHOPPERS',fact:'Baby planthoppers have real gears in their legs, the only gears ever found on a living animal.'},crystalmite:{name:'CRYSTAL MITES',fact:'A mite so small you would need a hand lens to see it. In the Crystal world they are said to glitter like dust.'},leafcutter:{name:'LEAFCUTTER ANT',fact:'Leafcutter ants do not eat leaves. They chew them into mulch to grow a fungus garden underground.'},morpho:{name:'BLUE MORPHO',fact:'A blue morpho\'s wings are not blue at all. Tiny ridges bend the light, the way a soap bubble does.'},harlequin:{name:'HARLEQUIN BEETLE',fact:'The harlequin beetle\'s front legs can be longer than its whole body. Tiny false scorpions hitch rides under its wings.'},cavecricket:{name:'CAVE CRICKET',fact:'Cave crickets live in the dark, so many are pale and their long feelers do the seeing.'},millipede:{name:'MILLIPEDE',fact:'Millipede means a thousand feet, but most have a few hundred. One kind in Australia really has over 1,300.'},whipscorpion:{name:'WHIP SCORPION',fact:'A whip scorpion has no sting. When bothered it sprays vinegar, which is why it is also called a vinegaroon.'},stonefly:{name:'STONEFLY',fact:'Stoneflies need cold, clean water. Their babies breathe with gills and do push-ups when the water gets low.'},apollo:{name:'APOLLO BUTTERFLY',fact:'The Apollo butterfly lives high in the mountains. Its white wings with red spots are thin enough to see through.'},snowflea:{name:'SNOW FLEA',fact:'Snow fleas are springtails that hop about on top of the snow in winter, thanks to a natural antifreeze inside them.'},sandhopper:{name:'SAND HOPPER',fact:'Sand hoppers dig into the beach by day and jump about at night. They use the moon to find their way home.'},isopod:{name:'SEA SLATER',fact:'A sea slater is a cousin of the pill bug that lives at the shore. It breathes with gills, so it stays near the water.'},shorefly:{name:'SHORE FLY',fact:'Some shore flies live in hot springs and salty lakes where almost nothing else can survive.'},lavacricket:{name:'LAVA CRICKET',fact:'A real cricket from Hawaii. It moves onto fresh lava within weeks of it cooling, before any plant has grown.'},ashmoth:{name:'ASH MOTH',fact:'A legend of the Volcano world: a grey moth that rests on warm cinders and only flies when the ground shakes.'},blisterbeetle:{name:'BLISTER BEETLE',fact:'Blister beetles carry a chemical in their blood that blisters skin. Birds and frogs learn to leave them alone.'},scorpionfly:{name:'SCORPIONFLY',fact:'A scorpionfly cannot sting. The curled tail on the male only looks like one, and he uses it to hold on.'},iceworm:{name:'ICE WORM',fact:'Ice worms live inside glaciers and die if they get warmer than a few degrees above freezing.'},woollybear:{name:'WOOLLY BEAR',fact:'The woolly bear caterpillar freezes solid in winter, thaws out in spring, and turns into a tiger moth.'},cockroach:{name:' // ---- quit + resume (Matt 9/2: "when I pause I can quit, and then resume on start up") ----
// A checkpoint is the run at the START of the current world: stage, score, lives, gun, bombs.
// Written when you quit from the pause menu (and when the app is sent to the background),
// cleared by any fresh start or by the run ending. The title's PLAY becomes RESUME while one exists.
const CP_KEY='hs_checkpoint';
function saveCheckpoint(){if(state!=='play')return;try{localStorage[CP_KEY]=JSON.stringify({stage,loop,score,lives:P.lives,wpn:P.wpn,lvl:P.lvl,bombs:P.bombs,contract:contractIx,daily:dailyRun,chainBest,when:Date.now()});}catch(e){}}
function loadCheckpoint(){try{const c=JSON.parse(localStorage[CP_KEY]||'null');return c&&c.stage?c:null;}catch(e){return null;}}
function clearCheckpoint(){try{localStorage.removeItem(CP_KEY);}catch(e){}}
function quitToHome(){saveCheckpoint();paused=false;resumeCountdown=0;state='title';enemies=[];ebullets=[];bullets=[];pickups=[];parts=[];boss=null;bossAlive=false;bossWarn=0;levelClear=0;music('title');msgT=0;}
function resumeRun(){const c=loadCheckpoint();if(!c)return false;
 contractIx=Math.min(CONTRACTS.length-1,c.contract|0);startStage=clamp(c.stage,1,16);wantDaily=false;start();
 stage=c.stage;loop=c.loop|0;score=c.score|0;chainBest=c.chainBest|0;dailyRun=c.daily||null;
 Object.assign(P,{lives:c.lives,wpn:c.wpn||'honey',lvl:c.lvl||1,bombs:c.bombs|0});
 buildDecor((stage-1)%NL);palA=palB=(stage-1)%NL;clearCheckpoint();say('RESUMED  \u00b7  WORLD '+((stage-1)%NL+1));return true;}

// ---------- what each world does TO you ----------
// difficulty was only ever "more bugs, faster". every world now has one hazard of its own, so
// level 12 does not just feel like level 4 with extra health.
let slideVX=0, slideVY=0, gustT=0, gustA=0;
function worldForce(){
 const name=LV().name, d=D();
 switch(name){
  case 'THE POND': case 'THE SWAMP':          // a current pushes you off your line
   P.x+=Math.sin(t*.012)*1.5*d;break;
  case 'THE TIDE POOL':                        // the wash surges up and drags back
   P.y+=Math.sin(t*.02)*1.7*d;break;
  case 'THE DUNES':                            // gusts shove you sideways, then stop
   if(--gustT<=0){gustT=RI(150,320);gustA=R(-1,1)<0?-1:1;}
   if(gustT<90)P.x+=gustA*(1.6+d)*Math.sin((90-gustT)/90*Math.PI);break;
  case 'THE ALPINE':                           // downslope wind
   P.x+=Math.sin(t*.007)*1.2*d;P.y+=.35*d;break;
  case 'THE TUNDRA':                           // ice: you keep sliding after you stop
   slideVX=slideVX*.90+(P.x-P.px)*.30;slideVY=slideVY*.90+(P.y-P.py)*.30;
   P.x+=slideVX;P.y+=slideVY;break;
  case 'THE CANOPY':                           // rain drags you down through the leaves
   P.y+=.55*d;break;
  case 'THE ROOFTOPS':                         // traffic draws you toward the street
   P.x+=(W*.5-P.x)*.006*d;break;
  case 'THE HIVE':                             // wax underfoot, everything is heavier
   P.x-=(P.x-P.px)*.22;P.y-=(P.y-P.py)*.22;break;
 }
 P.px=P.x;P.py=P.y;
}

// ---------- coordinated arrivals ----------
// waves used to be scattered and crossed over one another. these come down as mirrored,
// evenly spaced formations so an attack reads as deliberate instead of messy.
function formSym(kind,n,opt){
 const mid=W/2,step=(W-140)/Math.max(1,n-1);
 for(let i=0;i<n;i++){
  const x=70+i*step, off=Math.abs(x-mid)/mid;      // outer wings enter a beat later
  spawn(kind,x,-30-off*70,Object.assign({pat:'march'},opt||{}));
 }
}
function formArc(kind,n,opt){
 for(let i=0;i<n;i++){
  const f=n===1?.5:i/(n-1), x=70+f*(W-140);
  const dip=Math.sin(f*Math.PI)*70;                 // a shallow bowl, symmetric about centre
  spawn(kind,x,-30-dip,Object.assign({pat:'sine',ox:x},opt||{}));
 }
}
function formWedge(kind,n,opt){
 const mid=W/2,half=Math.floor(n/2);
 for(let i=-half;i<=half;i++){
  if(n%2===0&&i===0)continue;
  spawn(kind,mid+i*46,-30-Math.abs(i)*44,Object.assign({pat:'march'},opt||{}));
 }
}
function formTwin(kind,n,opt){                       // mirrored pairs, never crossing
 const mid=W/2;
 for(let i=1;i<=Math.ceil(n/2);i++){
  const dx=i*52;
  spawn(kind,mid-dx,-30-i*30,Object.assign({pat:'march'},opt||{}));
  spawn(kind,mid+dx,-30-i*30,Object.assign({pat:'march'},opt||{}));
 }
}

function wave(){const lv=LV(),pr=stageT/lv.len;
 if(stageT>lv.len){for(const e of enemies){if(e.pat!=='fall'){e.pat='fall';e.vy=2.8;}}return;}
 const cap=6+Math.floor(((stage-1)%NL)*1.1)+loop*2;
 // count only REAL bugs against the cap. a gnat cloud is 40-plus tiny sprites and it was
 // blowing straight past the cap, so one cloud starved the whole level of actual enemies.
 let big=0;for(const e of enemies)if(!e.tiny&&!e.dead)big++;
 // an empty screen is dead air. if nothing is left to fight, the next wave comes NOW
 // instead of waiting out the timer.
 if(big===0&&nextWave>stageT)nextWave=stageT;
 if(stageT<nextWave||big>=cap)return;
 const gap=Math.max(96-((stage-1)%NL)*4,206-pr*95-(stage-1)*11-loop*20);   /* fewer bugs at once, so they arrive sooner */nextWave=stageT+gap;
 // a gnat cloud is atmosphere, not a wave. it used to consume the wave slot and return,
 // so a level could be nothing but gnats for ten seconds. now it drops the cloud and the
 // real wave keeps coming in the same breath. spaced out too, since levels are twice as long.
 if(stageT>=nextCloud){nextCloud=stageT+RI(1250,1850)-(lv.decor==='pond'?250:0);FORMS.cloud();say((BUGINFO[LV().cloud]?BUGINFO[LV().cloud].name:'GNATS')+' SWARMING!');}
 const fod=lv.roster.filter(k=>FODDER.includes(k)),sho=lv.roster.filter(k=>SHOOTERS.includes(k));
 // the newest bug of each world (last in its roster) was one random pick among six and went
 // unseen for whole runs; give it four in ten of the waves it qualifies for

// ---------- pickups ----------
function drop(x,y,force){const r=Math.random();let k=null;
 // the old chain tested r<.14 and r<.143 AFTER r<.17, so bombs and lives never dropped
 // by chance -- only when forced. now they exist. ROYAL FEAST doubles the nectar band.
 const nb=MODS.feast?.22:.11;
 if(force)k=force;else if(r<nb)k='nectar';else if(r<nb+.06)k=randWeapon();else if(r<nb+.09)k='bomb';else if(r<nb+.093)k='life';
 if(k==='bomb'&&MODS.nobomb)k='nectar';   // NO SWARM CALLS means none, not "found one anyway"
 if(k)pickups.push({x,y,k,vy:1.1,t:0});}
function take(p){buzz('light');
 if(p.k==='nectar'){SFX.nectar();if(P.lvl<5){P.lvl++;say('POWER UP  Lv'+P.lvl);pop(p.x,p.y,'POWER Lv'+P.lvl,'#ffd23f',13);}else{addScore(1000);say('MAX POWER +1000');pop(p.x,p.y,'+1000','#ffd23f',13);}}
 else if(p.k==='bomb'){SFX.bomb();P.bombs=Math.min(5,P.bombs+1);say('SWARM CALL +1');pop(p.x,p.y,'+1 BOMB','#8dff9a',13);}
 else if(p.k==='life'){SFX.life();P.lives++;say('EXTRA LIFE!');pop(p.x,p.y,'1 UP','#8dff9a',15);buzz('success');}
 else{SFX.weapon(p.k);if(P.wpn!==p.k){bullets=bullets.filter(b=>!b.orbit&&!b.drone&&b.k!=='wall'&&b.k!=='lure');lashT=null;}if(P.wpn===p.k){P.lvl=Math.min(5,P.lvl+1);say(WEAPONS[p.k].name+'  Lv'+P.lvl);}else{P.wpn=p.k;P.lvl=Math.max(1,P.lvl-1);say(WEAPONS[p.k].name+'  —  '+WEAPONS[p.k].tag);}}}
let chain=0,chainT=0,chainBest=0,grazed=0,nextExt=0;
const EXTENDS=[100000,250000,500000,900000];
const chainMult=()=>Math.min(8,1+Math.floor(chain/6));
function addScore(n){const got=Math.round(n*chainMult()*cmult);score+=got;
 while(nextExt<EXTENDS.length&&score>=EXTENDS[nextExt]){nextExt++;P.lives++;say('EXTRA LIFE!');announce('EXTRA LIFE!','#8dff9a');buzz('success');
  jingle([880,1174,1568,2093],'sine',.03,.07);}return got;}
function onKill(){chain++;chainT=190;if(chain>chainBest)chainBest=chain;
 if(chain%6===0){
  // Matt built this and still had to ask what x8 was. Name it once, the first time it
  // pays, then go back to the short form so it stops being noise.
  if(learned.has('chain'))announce('CHAIN x'+chainMult());else say('CHAIN x2  \u00b7  EVERY POINT DOUBLED');
  learned.add('chain');buzz('medium');
  snd(700+chainMult()*90,.06,'sine',.03,1400);}
 if(chainMult()===8){frenzyKills++;if(frenzy<=0&&(frenzyKills===1||frenzyKills%24===0))frenzyStart();}}
function breakChain(){if(chain>2)say('CHAIN LOST');chain=0;chainT=0;frenzyKills=0;if(frenzy>0)frenzy=Math.min(frenzy,30);}
function chainTick(){if(chainT>0&&--chainT===0){chain=0;frenzyKills=0;if(frenzy>0)frenzy=Math.min(frenzy,30);}}
// close kills pay double and feed the chain an extra step -- parking on a bug's face is
// a choice, so it pays like one. 84px is "in their face" without kissing hitboxes.
function killScore(e){const near=!P.dead&&(e.x-P.x)**2+(e.y-P.y)**2<84*84;
 STAT.dex[e.type]=(STAT.dex[e.type]||0)+1;   // the Bug-Dex counts every kill
 const got=addScore(e.sc*(near?2:1));onKill();
 if(!e.tiny){pop(e.x,e.y,'+'+got,near?'#8dff9a':e.elite?'#ffd23f':'#fff',near||e.elite?15:11);kring(e.x,e.y,near?'#8dff9a':'#ffd166');}

 if(near){stop(2);buzz('light');chain++;if(chain>chainBest)chainBest=chain;chainT=230;sparks(e.x,e.y,'#8dff9a',5,7);
  if(!learned.has('pb')){say('POINT BLANK x2  \u00b7  CLOSE KILLS PAY DOUBLE');learned.add('pb');}}}
// grazing: sliding close past a shot without being hit pays, and tops up your bombs.
// a shot whose path clips the bee inside 16 frames is HOT (green ring): grazing that
// one pays double. the ring goes on the bullet that matters, not a random sparkle.
function grazeTick(){if(P.dead||P.inv>0)return;
 for(const b of ebullets){if(b.dead)continue;
  if(b.kind==='web')b.hot=0;
  else{const rx=b.x-P.x,ry=b.y-P.y,sp2=b.vx*b.vx+b.vy*b.vy||1e-6,tc=clamp(-(rx*b.vx+ry*b.vy)/sp2,0,16),cx=rx+b.vx*tc,cy=ry+b.vy*tc;b.hot=cx*cx+cy*cy<(b.r+9)**2?1:0;}
  if(b.grz)continue;
  const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy),near=P.r+b.r+3,far=P.r+b.r+22;
  if(d>near&&d<far){const pays=b.hot?2:1;b.grz=1;const got=addScore(60*pays);if(b.hot)pop(b.x,b.y,'+'+got,'#8dff9a',10);
   sparks(b.x+(dx?dx/d*6:0),b.y+(dy?dy/d*6:0),b.hot?'#8dff9a':'#ffe680',2,4);
   for(let g=pays;g--;){grazed++;
    if(grazed%22===0&&P.bombs<5){P.bombs++;say(learned.has('graze')?'BOMB FROM GRAZING':'FREE BOMB  \u00b7  FOR SLIPPING PAST SHOTS');learned.add('graze');}}
   if(grazed%6<pays)snd(2200,.03,'sine',.012,3000);}}}
function hitPlayer(){if(P.inv>0||P.dead)return;if(P.bombs>0){bomb();P.inv=90;say('AUTO SWARM CALL!');return;}breakChain();P.lives--;P.dead=90;shake=20;stop(10);buzz('heavy');boom(P.x,P.y,'#ffd166',40,7);noise(.7,.05,1400,.6,200,'lowpass');swell(90,.9,'sine',.08,.05,40);
 P.lvl=Math.max(1,P.lvl-1);ebullets=[];
 if(P.lives<0){state='over';music('title');endRun();if(score>hi){hi=score;localStorage.hs_hi=hi;}}}


// ---------- juice: the game showing you what just happened ----------
// hitstop freezes the whole sim for a few frames on the big beats (the frame loop skips
// update while it counts down); pops are the numbers that fly off a kill; rings mark the
// spot; the announcer is the chain step, punched in big and gone fast. All of it draws
// above the world and under the HUD, and none of it is something to dodge.
let hitstop=0,ann=null,slowmo=0;const POPS=[];
// HIVE FRENZY: reaching chain x8 (and every 24 kills you hold it) buys five seconds of
// double fire rate under a gold sky, with the music pushed up. x8 was just a number.
let frenzy=0,frenzyKills=0;
// set pieces (roadmap): the hive collapsing under you when the Centipede Mother dies, the
// rooftop blackout, and the Atlas Moth's death taking the music with it.
let collapse=0,collapseAt=null,blackout=0,blackoutStage=0;
function frenzyStart(){frenzy=300;announce('HIVE FRENZY!','#ffd23f');buzz('success');flash=.35;shake=10;jingle([880,1108,1318,1760,2217],'square',.018,.06);}
function stop(n){hitstop=Math.max(hitstop,n);}
function pop(x,y,s,col='#fff',size=12){if(POPS.length>28)POPS.shift();POPS.push({x,y:y-6,s,col,size,t:0,vy:-1.1});}
// kring, not ring: 18_scene_motion.js owns ring() for the big shockwaves, and a later
// declaration wins, so every kill was pushing a 60px shockwave instead of this flick.
function kring(x,y,col){if(POPS.length>28)POPS.shift();POPS.push({x,y,ring:1,col,t:0});}
function announce(s,col='#ffd23f'){ann={s,col,t:0};}
// ---------- the pop when a bug dies (9/3) ----------
// Matt: "the way that things get blown up ... the way things look in anime". Three cheap beats,
// in this order: the world holds still for a frame or two, the bug goes white and blows apart
// along radial lines, and a ring snaps outward. Bigger bugs get a longer hold and a screen flash.
let killHeldAt=-1;
function killFx(e){
 const big=!!e.elite||e.r>=17;
 // one hold per frame, so a whole wave dying together cannot lock the game up
 if(killHeldAt!==t){killHeldAt=t;stop(big?4:2);}
 ring(e.x,e.y,big?'#ffffff':e.col,big?110:70);
 boom(e.x,e.y,e.col,big?32:20,big?7:5.2);
 sparks(e.x,e.y,'#fff',big?16:10,big?12:9);
 const n=big?12:8;                                   // radial speed lines: the impact tell
 for(let i=0;i<n;i++){const a=i/n*Math.PI*2+R(-.12,.12),sp2=R(7,12.5);
  parts.push({x:e.x,y:e.y,vx:Math.cos(a)*sp2,vy:Math.sin(a)*sp2,l:R(7,13),c:'#fff',r:R(1,2),spark:1});}
 if(POPS.length>28)POPS.shift();
 POPS.push({x:e.x,y:e.y,flare:1,col:big?'#fff':'#ffe9a8',size:big?e.r*3.4:e.r*2.6,t:0});
 if(big){flash=Math.max(flash,.32);shake=Math.max(shake,9);}
}
function juiceTick(){if(frenzy>0){frenzy--;if(P.fireT>1)P.fireT--;if(t%3===0&&!P.dead)parts.push({x:P.x+R(-26,26),y:P.y+R(-20,26),vx:R(-.6,.6),vy:R(-2.2,-.8),l:R(14,26),c:['#ffd23f','#fff3b0','#ffb300'][RI(0,2)],r:R(1.2,2.6)});}for(let i=POPS.length;i--;){const p=POPS[i];p.t++;if(p.flare){if(p.t>11)POPS.splice(i,1);continue;}if(p.ring){if(p.t>14)POPS.splice(i,1);}else{p.y+=p.vy;p.vy*=.94;if(p.t>44)POPS.splice(i,1);}}if(ann&&++ann.t>60)ann=null;}
function drawJuice(){
 if(frenzy>0){const k=Math.min(1,frenzy/30)*(.85+.15*Math.sin(t*.3));X.save();const g=X.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.72);g.addColorStop(0,'rgba(255,200,40,0)');g.addColorStop(1,'rgba(255,190,30,'+(.34*k)+')');X.fillStyle=g;X.fillRect(0,0,W,H);
  X.textAlign='left';X.font='bold 11px '+FONT;X.fillStyle='rgba(255,220,80,'+k+')';X.shadowColor='#000';X.shadowBlur=4;X.fillText('HIVE FRENZY  '+(frenzy/60).toFixed(1)+'s  ·  double fire',10,H-44);X.restore();}
 if(!POPS.length&&!ann)return;X.save();X.globalAlpha=1;
 for(const p of POPS){if(p.flare){const f=p.t/11;X.save();X.globalCompositeOperation='lighter';X.globalAlpha=(1-f)*(1-f);X.fillStyle=rg(p.x+pxo(p.x,p.y),p.y,p.size*(1+f*1.5),p.col,'rgba(255,255,255,0)');ell(p.x+pxo(p.x,p.y),p.y,p.size*(1+f*1.5),p.size*(1+f*1.5));X.fill();X.restore();continue;}

function rg(x,y,r,c1,c2){if(LOW3)return /,\s*0\)\s*$/.test(c2)?'rgba(0,0,0,0)':c1;   // bare bones: flat bodies, no glows
 const g=X.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
const hexA=(h,a)=>{const p=parseInt(h.slice(1),16);return 'rgba('+(p>>16)+','+((p>>8)&255)+','+(p&255)+','+a+')';};
function lerpC(a,b,m){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=(pa>>16)+((pb>>16)-(pa>>16))*m,g=((pa>>8)&255)+(((pb>>8)&255)-((pa>>8)&255))*m,bl=(pa&255)+((pb&255)-(pa&255))*m;return `rgb(${r|0},${g|0},${bl|0})`;}
// ---- EMBOSS: render a sprite offscreen, then composite ground shadow + drop shadow + light rim + dark rim.
// This cached one scratch canvas per distinct glow size, forever. Thirty sizes x two
// slots x DPR3 came to 59 MB of scratch space that nothing ever released. Round the size
// to a step so near-identical requests share a canvas, and evict least-recently-used
// past a hard cap. Visually identical, bounded memory.
// emboss() draws the whole scratch canvas scaled into an SxS box, so the canvas has to be
// exactly S -- rounding sizes into buckets would silently rescale every sprite. Keep exact
// sizes and bound the CACHE instead: least-recently-used eviction past a hard cap, with the
// evicted canvas zeroed so the backing store is actually handed back.
const OC={},OCLRU=[],OCMAX=10;
// Called by fit() when the raster scale changes (rotation, window resize, moving between
// displays). Every cached surface and every mip pyramid was built for the OLD scale, so
// keeping them would draw the wrong size. Cheap to rebuild, wrong to keep.
function rasterReset(){
 try{for(const k in OC){const c=OC[k];if(c){c.width=0;c.height=0;}delete OC[k];}OCLRU.length=0;}catch(e){}
 try{_WB=null;}catch(e){}
 try{_MB=null;}catch(e){}
 try{for(const k in _GM)delete _GM[k];}catch(e){}
 const drop=o=>{try{for(const k in o){const im=o[k];if(im){if(im._mips)im._mips.length=0;im.dof=null;}}}catch(e){}};
 try{drop(SPR);}catch(e){} try{drop(ART);}catch(e){}
}
function oc(k,s){
 let c=OC[k];
 if(!c){
  while(OCLRU.length>=OCMAX){const old=OCLRU.shift();const d=OC[old];if(d){d.width=0;d.height=0;}delete OC[old];}
  c=OC[k]=document.createElement('canvas');c.width=s*DPR;c.height=s*DPR;c.g=c.getContext('2d');
 } else { const i=OCLRU.indexOf(k); if(i>=0)OCLRU.splice(i,1); }
 OCLRU.push(k);
 return c;}
function emboss(x,y,box,fn,o={}){
 if(LOW2){const alt=o.alt==null?1:o.alt,bob=alt>0?(Math.sin(t*.18+x*.02+y*.01)*.5+.5):0,lift=bob*4*alt;y-=lift;
  X.save();if(alt>0){X.globalAlpha=.30*alt*(1-bob*.25);X.fillStyle=LV().shadow;ell(x+8*alt+bob*3,y+box*.24*alt+lift+bob*2,box*.14,box*.052);X.fill();}
  X.globalAlpha=1;if(o.filter)X.filter=o.filter;X.translate(x,y);fn();X.restore();return;}

 const _X=X;X=a;a.setTransform(DPR,0,0,DPR,0,0);a.clearRect(0,0,S,S);a.save();a.translate(S/2,S/2);fn();a.restore();X=_X;
 const rim=(dx,dy,col)=>{b.setTransform(DPR,0,0,DPR,0,0);b.globalCompositeOperation='source-over';b.clearRect(0,0,S,S);b.drawImage(A,0,0,S,S);b.globalCompositeOperation='source-in';b.fillStyle=col;b.fillRect(0,0,S,S);b.globalCompositeOperation='destination-out';b.drawImage(A,dx,dy,S,S);};

 if(alt>0){const sh=1-bob*.18;X.globalAlpha=.30*alt*(1-bob*.25);X.fillStyle=LV().shadow;if(!LOW)X.filter='blur(5px)';ell(x+8*alt+bob*3,y+box*.24*alt+lift+bob*2,box*.14*sh,box*.052*sh);X.fill();X.filter='none';}
 if(!LOW){X.globalAlpha=.34;X.filter='brightness(0) blur(2px)';X.drawImage(A,x-S/2+3,y-S/2+4,S,S);X.filter='none';}
 X.globalAlpha=1;if(o.filter)X.filter=o.filter;X.drawImage(A,x-S/2,y-S/2,S,S);X.filter='none';
 rim(1.2,1.8,'#fff');X.globalAlpha=.26;X.drawImage(B,x-S/2,y-S/2,S,S);
 rim(-1.4,-2.0,'#000');X.globalAlpha=.34;X.drawImage(B,x-S/2,y-S/2,S,S);
 // gloss: a soft sheen across the top-left of the silhouette, like light on a shell
 b.globalCompositeOperation='source-over';b.clearRect(0,0,S,S);b.drawImage(A,0,0,S,S);b.globalCompositeOperation='source-in';const gg=b.createLinearGradient(0,0,S*.7,S*.9);gg.addColorStop(0,'rgba(255,255,255,.30)');gg.addColorStop(.45,'rgba(255,255,255,0)');b.fillStyle=gg;b.fillRect(0,0,S,S);X.globalAlpha=.28;X.drawImage(B,x-S/2,y-S/2,S,S);
 X.restore();}

// the painted hero with flapping wings (Matt 9/2: flap for my character, not the lives). The photo
// is one image, so the wings are cut out as two side boxes at draw time: each box is rotated a little
// about the wing root and squashed toward the body, a faint second copy is the beat blur, and the body
// is drawn last from everything outside the boxes so the roots are covered. Clips only, no pixel work,
// so it runs on file:// too.
const HW={x:.42,y0:.27,y1:.52,rootX:.42,rootY:.40};
function drawHero(im,h,rot=0){const m=mip(im,h),sc=h/m.height,w=m.width*sc,L=-w/2,T=-h/2;X.save();X.rotate(rot);
 const a=Math.sin(t*1.5)*.14;
 const wing=(sgn,ang,al)=>{X.save();X.globalAlpha=al;const rx=L+(sgn<0?HW.rootX:1-HW.rootX)*w,ry=T+HW.rootY*h;
  X.translate(rx,ry);X.rotate(sgn*ang);X.scale(1,1-Math.abs(ang)*1.1);X.translate(-rx,-ry);
  X.beginPath();X.rect(sgn<0?L:L+(1-HW.x)*w,T+HW.y0*h,HW.x*w,(HW.y1-HW.y0)*h);X.clip();X.drawImage(m,L,T,w,h);X.restore();};
 if(!LOW){wing(-1,-a*1.7,.22);wing(1,-a*1.7,.22);}
 wing(-1,a,1);wing(1,a,1);
 X.beginPath();X.rect(L,T,w,h);X.rect(L,T+HW.y0*h,HW.x*w,(HW.y1-HW.y0)*h);X.rect(L+(1-HW.x)*w,T+HW.y0*h,HW.x*w,(HW.y1-HW.y0)*h);X.clip('evenodd');X.drawImage(m,L,T,w,h);
 X.restore();}

function heroWing(sgn,r,D,a,alpha){X.save();X.translate(sgn*r*.22,-r*.5);X.rotate(sgn*a);X.globalAlpha=alpha;
 const wing=(cx,cy,rx,ry,rot)=>{const g=X.createLinearGradient(0,0,sgn*rx*2,cy);g.addColorStop(0,'rgba(255,240,190,.92)');g.addColorStop(.6,'rgba(255,222,140,.80)');g.addColorStop(1,'rgba(255,200,90,.62)');X.fillStyle=g;ell(cx,cy,rx,ry,rot);X.fill();
  X.strokeStyle='rgba(130,80,15,.85)';X.lineWidth=Math.max(1,r*.05);ell(cx,cy,rx,ry,rot);X.stroke();};
 wing(sgn*r*1.05,-r*.45,r*1.1,r*.46,sgn*-.42);      // forewing: up and out
 wing(sgn*r*.85,r*.15,r*.78,r*.34,sgn*-.08);         // hindwing: out and a little back
 if(D){X.strokeStyle='rgba(140,90,20,.6)';X.lineWidth=Math.max(.8,r*.03);X.beginPath();
  X.moveTo(0,-r*.1);X.quadraticCurveTo(sgn*r*.9,-r*1.0,sgn*r*2.05,-r*.95);
  X.moveTo(0,0);X.quadraticCurveTo(sgn*r*1.0,-r*.55,sgn*r*2.1,-r*.55);
  X.moveTo(0,r*.1);X.quadraticCurveTo(sgn*r*.9,-r*.15,sgn*r*1.9,-r*.15);
  X.moveTo(0,r*.2);X.quadraticCurveTo(sgn*r*.8,r*.2,sgn*r*1.6,r*.35);
  for(let k=1;k<=4;k++){const x=sgn*r*(.4+k*.38);X.moveTo(x,-r*(.95-k*.06));X.lineTo(x*.97,r*(.05+k*.05));}
  X.stroke();X.globalAlpha=alpha*.45;X.fillStyle='#fff';ell(sgn*r*.7,-r*.55,r*.45,r*.14,sgn*-.45);X.fill();}
 X.restore();}

// the background is a photograph, so overlays alone will never make it move. these take a snapshot
// of the frame and redraw the part of it that should be alive one thin strip at a time, each strip
// pushed on its own wave. that is what makes the water ripple, the trees sway and the lava run.

function weaponGlyph(k,x,y,r,col){X.save();X.translate(x,y);X.fillStyle=col;X.strokeStyle=col;X.lineCap='round';X.lineWidth=2.2;X.shadowColor='#000';X.shadowBlur=3;

  case 'stinger':X.lineWidth=3;X.beginPath();X.moveTo(0,r);X.lineTo(0,-r);X.stroke();X.globalAlpha=.4;X.lineWidth=7;X.stroke();break;                                        // one beam
  case 'pollen':for(let i=0;i<3;i++){const a=-1.2+i*1.2;ell(Math.cos(a)*r*.55,Math.sin(a)*r*.55,r*.26,r*.26);X.fill();}X.lineWidth=1.5;X.beginPath();X.arc(0,0,r*.55,-1.5,1.6);X.stroke();break;   // seekers curving in
  case 'water':X.beginPath();X.moveTo(0,-r);X.quadraticCurveTo(r*.9,r*.2,0,r*.9);X.quadraticCurveTo(-r*.9,r*.2,0,-r);X.fill();break;                                          // a drop
  case 'wax':ell(0,0,r*.85,r*.7);X.fill();ell(r*.35,r*.75,r*.3,r*.4);X.fill();break;                                                                                          // a glob
  case 'thorn':X.lineWidth=2.5;for(const a of[-.5,-.25,0,.25,.5]){X.beginPath();X.moveTo(0,r*.9);X.lineTo(Math.sin(a)*r,r*.9-Math.cos(a)*r*1.8);X.stroke();}break;              // shotgun spray
  case 'petal':X.lineWidth=2;X.beginPath();X.arc(0,0,r*.75,0,7);X.stroke();for(let i=0;i<6;i++){const a=i*Math.PI/3;ell(Math.cos(a)*r*.75,Math.sin(a)*r*.75,r*.2,r*.2);X.fill();}break;   // orbit
  case 'lance':X.lineWidth=3;X.beginPath();X.moveTo(0,r);X.lineTo(0,-r*.2);X.stroke();X.beginPath();X.moveTo(0,-r);X.lineTo(-r*.35,-r*.2);X.lineTo(r*.35,-r*.2);X.closePath();X.fill();break;   // spear
  case 'drones':for(const dx of[-r*.55,r*.55]){ell(dx,0,r*.32,r*.26);X.fill();X.globalAlpha=.5;ell(dx-r*.25,-r*.3,r*.22,r*.12,-.5);X.fill();ell(dx+r*.25,-r*.3,r*.22,r*.12,.5);X.fill();X.globalAlpha=1;}break;   // two bees

  case 'lure':X.lineWidth=1.6;for(const rr of[r*.35,r*.65,r*.95]){X.globalAlpha=1.2-rr/r;X.beginPath();X.arc(0,0,rr,0,7);X.stroke();}X.globalAlpha=1;ell(0,0,r*.2,r*.2);X.fill();break;   // rings
  case 'grenade':X.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;X.lineTo(Math.cos(a)*r*.85,Math.sin(a)*r*.85);}X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.45)';for(let i=0;i<6;i++){const a=i*Math.PI/3;ell(Math.cos(a)*r*.42,Math.sin(a)*r*.42,r*.12,r*.12);X.fill();}break;   // comb

 X.restore();}
